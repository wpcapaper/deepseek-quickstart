<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dify贪吃蛇网页版</title>
    <style>
        /* 基础样式 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            background-color: white;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .status-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 18px;
            color: #333;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #2e7d32;
            color: white;
            margin-top: 20px;
        }

        button:focus {
            outline: 2px solid #1b5e20;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: none;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(46, 125, 50, 0.7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            pointer-events: auto;
            user-select: none;
        }

        @media (min-width: 768px) {
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <div>得分: <span id="score">0</span></div>
        <div>最高分: <span id="high-score">0</span></div>
    </div>
    
    <div class="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="start-screen" class="start-screen">
            <h1>贪吃蛇</h1>
            <p>使用方向键或WASD控制蛇移动</p>
            <button id="start-button">开始游戏</button>
        </div>
        
        <div id="game-over-screen" class="game-over-screen hidden">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="final-score">0</span></p>
            <p>最高分: <span id="final-high-score">0</span></p>
            <button id="restart-button">再玩一次</button>
        </div>
    </div>

    <div class="controls">
        <div class="control-btn" id="up-btn">↑</div>
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="control-btn" id="left-btn">←</div>
            <div class="control-btn" id="right-btn">→</div>
        </div>
        <div class="control-btn" id="down-btn">↓</div>
    </div>

    <script>
        // Author: Dify全栈研发专家
        // Date: 2025-10-07 16:13:58

        class SnakeGame {
            constructor() {
                // 获取画布和上下文
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // 设置画布尺寸
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                // 游戏状态
                this.gameRunning = false;
                this.gameOver = false;
                
                // 游戏参数
                this.gridSize = 20;
                this.cellSize = this.canvas.width / this.gridSize;
                this.speedLevels = [150, 120, 100, 80, 60]; // 不同等级的速度（毫秒）
                this.currentSpeedLevel = 0;
                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('dify_snake_high_score')) || 0;
                
                // 初始化蛇的位置和方向
                this.snake = [];
                this.direction = { x: 1, y: 0 }; // 默认向右移动
                this.nextDirection = { x: 1, y: 0 };
                
                // 食物位置
                this.food = { x: 0, y: 0 };
                
                // DOM元素引用
                this.startScreen = document.getElementById('start-screen');
                this.gameOverScreen = document.getElementById('game-over-screen');
                this.scoreElement = document.getElementById('score');
                this.highScoreElement = document.getElementById('high-score');
                this.finalScoreElement = document.getElementById('final-score');
                this.finalHighScoreElement = document.getElementById('final-high-score');
                
                // 绑定事件监听器
                this.bindEventListeners();
                
                // 初始化最高分显示
                this.highScoreElement.textContent = this.highScore;
                
                // 请求动画帧ID
                this.animationId = null;
                
                // 上次更新时间
                this.lastUpdateTime = 0;
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
                this.cellSize = this.canvas.width / this.gridSize;
            }
            
            bindEventListeners() {
                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (!this.gameRunning) return;
                    
                    switch(e.key) {
                        case 'ArrowUp':
                        case 'w':
                        case 'W':
                            if (this.direction.y === 0) {
                                this.nextDirection = { x: 0, y: -1 };
                            }
                            break;
                        case 'ArrowDown':
                        case 's':
                        case 'S':
                            if (this.direction.y === 0) {
                                this.nextDirection = { x: 0, y: 1 };
                            }
                            break;
                        case 'ArrowLeft':
                        case 'a':
                        case 'A':
                            if (this.direction.x === 0) {
                                this.nextDirection = { x: -1, y: 0 };
                            }
                            break;
                        case 'ArrowRight':
                        case 'd':
                        case 'D':
                            if (this.direction.x === 0) {
                                this.nextDirection = { x: 1, y: 0 };
                            }
                            break;
                        case ' ':
                            this.togglePause();
                            break;
                    }
                });
                
                // 开始按钮
                document.getElementById('start-button').addEventListener('click', () => {
                    this.startGame();
                });
                
                // 重新开始按钮
                document.getElementById('restart-button').addEventListener('click', () => {
                    this.startGame();
                });
                
                // 移动端控制按钮
                document.getElementById('up-btn').addEventListener('click', () => {
                    if (this.direction.y === 0) {
                        this.nextDirection = { x: 0, y: -1 };
                    }
                });
                
                document.getElementById('down-btn').addEventListener('click', () => {
                    if (this.direction.y === 0) {
                        this.nextDirection = { x: 0, y: 1 };
                    }
                });
                
                document.getElementById('left-btn').addEventListener('click', () => {
                    if (this.direction.x === 0) {
                        this.nextDirection = { x: -1, y: 0 };
                    }
                });
                
                document.getElementById('right-btn').addEventListener('click', () => {
                    if (this.direction.x === 0) {
                        this.nextDirection = { x: 1, y: 0 };
                    }
                });
                
                // 手势滑动控制（移动端增强体验）
                let touchStartX = 0;
                let touchStartY = 0;
                
                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    e.preventDefault();
                }, { passive: false });
                
                this.canvas.addEventListener('touchmove', (e) => {
                    if (!this.gameRunning) return;
                    
                    const touchEndX = e.touches[0].clientX;
                    const touchEndY = e.touches[0].clientY;
                    
                    const diffX = touchEndX - touchStartX;
                    const diffY = touchEndY - touchStartY;
                    
                    // 只有当滑动距离大于30px时才触发方向 change
                    if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                        if (Math.abs(diffX) > Math.abs(diffY)) {
                            // 水平滑动
                            if (diffX > 0 && this.direction.x === 0) {
                                this.nextDirection = { x: 1, y: 0 };
                            } else if (diffX < 0 && this.direction.x === 0) {
                                this.nextDirection = { x: -1, y: 0 };
                            }
                        } else {
                            // 垂直滑动
                            if (diffY > 0 && this.direction.y === 0) {
                                this.nextDirection = { x: 0, y: 1 };
                            } else if (diffY < 0 && this.direction.y === 0) {
                                this.nextDirection = { x: 0, y: -1 };
                            }
                        }
                        touchStartX = touchEndX;
                        touchStartY = touchEndY;
                    }
                    
                    e.preventDefault();
                }, { passive: false });
            }
            
            initGame() {
                // 初始化蛇的位置（中心）
                this.snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                
                // 重置方向
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                
                // 重置分数和速度等级
                this.score = 0;
                this.currentSpeedLevel = 0;
                this.scoreElement.textContent = this.score;
                
                // 生成第一个食物
                this.generateFood();
            }
            
            generateFood() {
                // 创建一个不在蛇身上的随机位置
                let newFood;
                let onSnake;
                
                do {
                    onSnake = false;
                    newFood = {
                        x: Math.floor(Math.random() * this.gridSize),
                        y: Math.floor(Math.random() * this.gridSize)
                    };
                    
                    // 检查是否在蛇身上
                    for (let segment of this.snake) {
                        if (segment.x === newFood.x && segment.y === newFood.y) {
                            onSnake = true;
                            break;
                        }
                    }
                } while (onSnake);
                
                this.food = newFood;
            }
            
            update() {
                // 更新方向
                this.direction = { ...this.nextDirection };
                
                // 计算新的头部位置
                const head = { 
                    x: this.snake[0].x + this.direction.x, 
                    y: this.snake[0].y + this.direction.y 
                };
                
                // 检查碰撞边界
                if (
                    head.x < 0 || 
                    head.x >= this.gridSize || 
                    head.y < 0 || 
                    head.y >= this.gridSize
                ) {
                    this.endGame();
                    return;
                }
                
                // 检查碰撞自己
                for (let i = 0; i < this.snake.length; i++) {
                    if (this.snake[i].x === head.x && this.snake[i].y === head.y) {
                        this.endGame();
                        return;
                    }
                }
                
                // 将新头部添加到蛇身
                this.snake.unshift(head);
                
                // 检查是否吃到食物
                if (head.x === this.food.x && head.y === this.food.y) {
                    // 增加分数
                    this.score += 10;
                    this.scoreElement.textContent = this.score;
                    
                    // 每吃5个食物提升一个速度等级
                    const newSpeedLevel = Math.min(
                        Math.floor(this.score / 50), 
                        this.speedLevels.length - 1
                    );
                    
                    if (newSpeedLevel > this.currentSpeedLevel) {
                        this.currentSpeedLevel = newSpeedLevel;
                    }
                    
                    // 生成新食物
                    this.generateFood();
                } else {
                    // 如果没有吃到食物，移除尾部
                    this.snake.pop();
                }
            }
            
            draw() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制网格（可选）
                /*
                this.ctx.strokeStyle = '#eee';
                for (let i = 0; i <= this.gridSize; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.cellSize, 0);
                    this.ctx.lineTo(i * this.cellSize, this.canvas.height);
                    this.ctx.stroke();
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * this.cellSize);
                    this.ctx.lineTo(this.canvas.width, i * this.cellSize);
                    this.ctx.stroke();
                }
                */
                
                // 绘制蛇
                for (let i = 0; i < this.snake.length; i++) {
                    const segment = this.snake[i];
                    
                    // 头部颜色更深
                    if (i === 0) {
                        this.ctx.fillStyle = '#1b5e20';
                    } else {
                        this.ctx.fillStyle = '#2e7d32';
                    }
                    
                    this.ctx.fillRect(
                        segment.x * this.cellSize, 
                        segment.y * this.cellSize, 
                        this.cellSize, 
                        this.cellSize
                    );
                    
                    // 添加边框使蛇身更清晰
                    this.ctx.strokeStyle = '#1b5e20';
                    this.ctx.strokeRect(
                        segment.x * this.cellSize, 
                        segment.y * this.cellSize, 
                        this.cellSize, 
                        this.cellSize
                    );
                }
                
                // 绘制食物
                this.ctx.fillStyle = '#f44336';
                this.ctx.beginPath();
                this.ctx.arc(
                    this.food.x * this.cellSize + this.cellSize / 2,
                    this.food.y * this.cellSize + this.cellSize / 2,
                    this.cellSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                
                // 给食物加点阴影效果
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                this.ctx.shadowBlur = 4;
                this.ctx.shadowOffsetX = 2;
                this.ctx.shadowOffsetY = 2;
                this.ctx.fill();
                this.ctx.shadowColor = 'transparent';
            }
            
            gameLoop(timestamp) {
                if (!this.gameRunning) return;
                
                const deltaTime = timestamp - this.lastUpdateTime;
                const updateInterval = this.speedLevels[this.currentSpeedLevel];
                
                if (deltaTime > updateInterval) {
                    this.update();
                    this.draw();
                    this.lastUpdateTime = timestamp;
                }
                
                this.animationId = requestAnimationFrame((timestamp) => this.gameLoop(timestamp));
            }
            
            startGame() {
                this.initGame();
                this.gameRunning = true;
                this.gameOver = false;
                this.startScreen.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');
                this.lastUpdateTime = performance.now();
                this.animationId = requestAnimationFrame((timestamp) => this.gameLoop(timestamp));
            }
            
            endGame() {
                this.gameRunning = false;
                this.gameOver = true;
                
                // 取消动画帧
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                // 更新最高分
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('dify_snake_high_score', this.highScore.toString());
                    this.highScoreElement.textContent = this.highScore;
                }
                
                // 显示游戏结束界面
                this.finalScoreElement.textContent = this.score;
                this.finalHighScoreElement.textContent = this.highScore;
                this.gameOverScreen.classList.remove('hidden');
            }
            
            togglePause() {
                if (this.gameOver) return;
                
                this.gameRunning = !this.gameRunning;
                
                if (this.gameRunning) {
                    this.lastUpdateTime = performance.now();
                    this.animationId = requestAnimationFrame((timestamp) => this.gameLoop(timestamp));
                } else {
                    if (this.animationId) {
                        cancelAnimationFrame(this.animationId);
                    }
                }
            }
        }
        
        // 初始化游戏
        window.addEventListener('DOMContentLoaded', () => {
            const game = new SnakeGame();
        });
    </script>
</body>
</html>
